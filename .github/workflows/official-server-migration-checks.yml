name: Official server migration checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Rust and project validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Validate project versions
        run: python scripts/version.py check

      - name: Run build-tooling tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libasound2-dev libx11-dev libxi-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev zlib1g-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            prpr-avc/static-lib
          key: migration-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'prpr-avc/ffmpeg-version') }}
          restore-keys: migration-checks-${{ runner.os }}-

      - name: Test core engine
        run: cargo test --locked -p prpr --no-default-features --lib

      - name: Test Phira client
        run: cargo test --locked -p phira --no-default-features --lib
