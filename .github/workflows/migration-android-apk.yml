name: Build Phira Pro migration APK

on:
  push:
    branches: [official-server-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Build installable Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Verify versions and Android build scripts
        run: |
          python scripts/version.py check
          python scripts/verify_android_multitouch.py
          python scripts/verify_android_refresh_rate.py

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libasound2-dev libx11-dev libxi-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev zlib1g-dev nasm yasm

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust and cargo-ndk
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache Android and Rust build data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            prpr-avc/static-lib
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: migration-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'prpr-avc/ffmpeg-version') }}
          restore-keys: migration-android-${{ runner.os }}-

      - name: Build installable debug APK
        working-directory: phira-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists and is signed
        run: |
          set -euo pipefail
          APK="phira-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p dist/android
          VERSION="$(python scripts/version.py show --field pro_version)"
          cp "$APK" "dist/android/PhiraPro-v${VERSION}-migration-debug-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PhiraPro-migration-android-apk
          path: dist/android/*.apk
          compression-level: 0
          if-no-files-found: error
